spring:
  application:
    name: wayfare-backend

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  datasource:
    url: jdbc:mysql://localhost:3306/wayfare_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

gemini:
  api-key: ${GEMINI_API_KEY:}
  api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}
  model: gemini-3.6-flash

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:vantung204}
  api-key: ${CLOUDINARY_API_KEY:793431789955133}
  api-secret: ${CLOUDINARY_API_SECRET:Z3OSs9MS_qq53sbe1jbRox7kSNI}
  folder: ${CLOUDINARY_FOLDER:wayfare/media}
